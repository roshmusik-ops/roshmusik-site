    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@300;500;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Birthstone+Bounce:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505; /* Pitch Black */
            color: #fafafa;
        }
        .font-heading {
            font-family: 'Space+Grotesk', sans-serif;
        }
        .font-slogan {
            font-family: 'Playfair Display', serif;
        }
        .font-signature {
            font-family: 'Birthstone Bounce', cursive;
        }
        
        /* Gold Metallic Shimmer */
        .gold-glitter {
            background: linear-gradient(
                to right, 
                #D4AF37, 
                #F9F295, 
                #8A6621, 
                #E6BE8A, 
                #D4AF37
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            background-size: 200% auto;
            animation: gold-shimmer 5s linear infinite;
        }

        @keyframes gold-shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .gold-glitter-border {
            border: 2px solid;
            border-image: linear-gradient(to right, #D4AF37, #F9F295, #8A6621, #E6BE8A, #D4AF37) 1;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* 3D Coin Emblem */
        .emblem-gold {
            background: radial-gradient(circle at 35% 35%, #D4AF37 0%, #8A6621 100%);
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.8),
                inset 0 1px 2px rgba(255,255,255,0.4),
                inset 0 -2px 4px rgba(0,0,0,0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Premium Gold Button Style */
        .btn-premium-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #F9F295 50%, #8A6621 100%);
            color: #000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium-gold:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6);
            filter: brightness(1.2) contrast(1.1);
        }

        .sparkle-container {
            position: relative;
        }

        .sparkle-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, #D4AF37 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.1;
            animation: sparkle-move 15s linear infinite;
            pointer-events: none;
        }

        @keyframes sparkle-move {
            from { background-position: 0 0; }
            to { background-position: 600px 600px; }
        }
        
        .top-nav-fade {
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .progress-gold {
            background: linear-gradient(to right, #D4AF37, #F9F295);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transition: width 2s ease-in-out;
        }

        /* Glitter Hover Effect for standard buttons */
        .hover-glitter:hover {
            animation: gold-shimmer 2s linear infinite;
            background: linear-gradient(to right, #D4AF37, #F9F295, #8A6621, #E6BE8A, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-color: #D4AF37;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
